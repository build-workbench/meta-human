# MetaHuman Engine - CI & Deploy
# 极简工作流：质量检查 + 构建 + 部署 + 发布

name: CI & Deploy

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NPM_VERSION: '11'

jobs:
  # ========== 质量检查 ==========
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - run: npm ci --prefer-offline

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  # ========== 部署 Pages ==========
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - run: npm ci --prefer-offline

      - name: Build for Pages
        run: npm run build:pages
        env:
          NODE_ENV: production

      - name: Publish gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish_dir="${RUNNER_TEMP}/gh-pages"
          git worktree add --detach "${publish_dir}" HEAD
          git -C "${publish_dir}" switch --orphan gh-pages
          cp -a dist/. "${publish_dir}/"
          touch "${publish_dir}/.nojekyll"
          git -C "${publish_dir}" add -A
          git -C "${publish_dir}" \
            -c 'user.name=github-actions[bot]' \
            -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "deploy: ${GITHUB_SHA}"
          git -C "${publish_dir}" push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages

  # ========== 发布 Release ==========
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: softprops/action-gh-release@v2
        with:
          name: MetaHuman Engine ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
